name: Build and Push Multi-Platform Image to GHCR

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache for Docker's buildx
        uses: actions/cache@v5
        with:
          path: .buildxcache/
          key: ${{ runner.os }}-buildx-${{ hashFiles('**/*.go', 'Dockerfile', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push multi-platform image
        run: |
          export DOCKER_IMAGE_TAG=$(git describe --exact-match --abbrev=0 2>/dev/null || echo "")
          make docker-buildx DOCKER_IMAGE_REPO=ghcr.io/opnpulse/thanos-operator PLATFORMS=linux/arm64,linux/amd64
